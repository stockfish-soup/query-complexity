[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-complexity"
version = "0.2.0"
description = "Quantum query complexity, adversary SDPs, and phase-oracle transducers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "cvxpy>=1.3"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.6"]
dev = ["pytest>=7"]
mosek = ["mosek"]
qiskit = ["qiskit"]

[tool.setuptools]
py-modules = ["query_complexity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
