[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-complexity"
version = "0.2.1"
description = "Quantum query complexity: adversary SDPs, junta learning, irrep hierarchies, and transducers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aleksandrs Krivcenko"}]
keywords = ["quantum", "query complexity", "semidefinite programming", "junta learning", "representation theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "cvxpy>=1.3"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.6"]
dev = ["pytest>=7", "build>=1", "twine>=5"]
mosek = ["mosek"]
qiskit = ["qiskit"]
symbolic = ["sympy>=1.11"]

[project.urls]
Homepage = "https://github.com/stockfish-soup/query-complexity"
Repository = "https://github.com/stockfish-soup/query-complexity"
Documentation = "https://github.com/stockfish-soup/query-complexity/blob/main/docs/README.md"
Issues = "https://github.com/stockfish-soup/query-complexity/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["query_complexity*", "junta_learning*", "sdp_hierarchy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
